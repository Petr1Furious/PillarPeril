# Start Countdown #
# The countdown in seconds that players get after being teleported onto their pillars, before the game actually starts.
# During this countdown, players cannot move and cannot take any damage, which gives them time to get ready.
# Set to 0 to disable the countdown and start immediately.
# Default: 3
start-countdown: 3


# Reconnect Grace #
# How many seconds a player who disconnects mid-game gets to come back before being eliminated.
# While disconnected they keep their spot, their pillar, and everything they built.
# Set to 0 to eliminate players the moment they leave.
# Default: 60
reconnect-grace: 60


# Platform Height #
# The y-coordinate that the bedrock platforms will raise to.
# Default: 200
platform-height: 200


# Platform Material #
# The material the platforms are made of.
# Default: bedrock
platform-material: bedrock


# Max Fall Distance #
# The maximum distance you can fall from the platforms until you die.
# This number will be extracted from the pillar height to determine the y-coordinate you die at.
# Default: 25.0
max-fall: 25.0


# Pillar Distance Factor #
# The factor of the distance between platforms. This is used to determine the radius of the pillar field.
# Default: 10.0
platform-distance-factor: 10.0


# Enable Draws #
# Whether draws can happen or not, which will happen among the last players if they all die within one second,
# which almost always means they all fell off the platform at almost the same time.
# Default: false
enable-draws: false

# An ordered list of commands to execute before any world or location is accessed.
# This runs for every game, no matter whether it was started via '/game start' or by the queue.
# This should only really be used to create a world for the game when using another plugin like MultiVerse.
#   Available Placeholders:
#     | -> '{id}'       : started game's ID
#     | -> '{mode}'     : started game's game-mode
#     | -> '{players}'  : amount of players in the started game
start-pre-commands:
  - /say Initializing game with {players} players... # <- example, you can freely remove this and leave the list empty.


# An ordered list of commands to execute after the world and location of the game were accessed.
# This runs for every game, no matter whether it was started via '/game start' or by the queue.
# Things like creating a world for the game cannot happen here anymore.
# Note that '{world}' is the game's actual world, so the temporary one when `disposable-worlds` is enabled.
#   Available Placeholders:
#     | -> '{id}'       : started game's ID
#     | -> '{mode}'     : started game's game-mode
#     | -> '{players}'  : amount of players in the started game
#     | -> '{world}'    : name of the game's world
#     | -> '{x}'        : the game's center location's x-component
#     | -> '{y}'        : the game's center location's y-component
#     | -> '{z}'        : the game's center location's z-component
start-post-commands:
  - /say Starting game at {x}/{y}/{z}... # <- example, you can freely remove this and leave the list empty.


# An ordered list of commands to execute after a game ended.
#   Available Placeholders:
#     | -> '{id}'       : started game's ID
#     | -> '{mode}'     : started game's game-mode
#     | -> '{players}'  : amount of players in the started game
#     | -> '{world}'    : name of the game's world
#     | -> '{x}'        : the game's center location's x-component
#     | -> '{y}'        : the game's center location's y-component
#     | -> '{z}'        : the game's center location's z-component
#     | -> '{cause}'    : the cause for the game ending, in snake_case
ending-commands:
  - /say Ending game with cause {cause}... # <- example, you can freely remove this and leave the list empty.


# Respawn at Config #
# Whether to respawn players at the configured `player-spawn` below instead of making them spectate.
# If spectating (=false), it will spawn players in spectator mode in the middle of the game.
# Default: false
respawn-at-config: false


# Player Spawn #
# Where and how to spawn players after the game ends.
# If above value is set to true, players will also spawn here when dying.
player-spawn:

  # The game mode to set players to when spawning here.
  # Set to 'previous' to leave the game mode alone, so players come out of a game in the same
  # mode they went in. Only name a game mode here if this spawn is a lobby everybody belongs in.
  game-mode: previous

  # The world to spawn in. The default world is called "world".
  world: world

  # The location to spawn the player at.
  # If the y-component is set to -64.0, the player will spawn at the world spawn.
  location:
    x: 0.0
    y: -64.0
    z: 0.0


# Queue #
# The optional queue module for automatically starting games when enough players joined.
queue:

  # Whether the queue module is enabled or not.
  enabled: true

  # The minimum amount of players needed to start a game.
  min-players: 3

  # The maximum amount of players before splitting the queue.
  max-players: 16

  # The interval in seconds between checking if the amount of player is valid and starting a game.
  # Set to -1 to start instantly as soon as `min-players` queued.
  check-interval: 30

  # How players enter or leave the queue.
  #   Available Methods:
  #     | -> command  : use '/queue' to enter the queue
  #     | -> auto     : anyone not in a game is automatically in the queue
  method: command

  # The game mode to use when starting a new game using the queue.
  # See below ('modes' section) for list of available game modes.
  mode: original

  # The arena queued games are started in, as named in the `arenas` section above.
  # Set to 'random' to pick a different arena for every game.
  arena: random


# Sound Effects #
sound-effects:

  # Controls all sound effects. If this is set to 'false', no sound effects will be played at all, ignoring all configuration below.
  enabled: true

  # The time in seconds when a cooldown will start playing.
  # Set to 0 to disable.
  # Default: 3
  cooldown: 3

  # Played when you receive an item.
  item: true


# Items #
# All settings related to the items players can receive.
# Potions, splash potions, lingering potions and tipped arrows are given with a random effect rolled
# for each one, as the plain item carries no effect at all. The effect-less potion types (water,
# mundane, thick and awkward) are never used.
items:

  # A list of all items which will never be given to players, independent of the game mode.
  blacklist:
    - air
    - ender_dragon_spawn_egg

  # The same, but matched as patterns, where '*' stands for any part of an item's name.
  # A pattern without any '*' simply names one item, so whole families and single items can share this list.
  # This exists because of how much of the item registry is filler: being handed one of the 23 pottery
  # sherds or one of the 19 armour trims wastes an item cycle, and the operator's tools - command
  # blocks, a debug stick, structure blocks - are not a game mechanic.
  # Items which are useful stay in however many there are of them: beds, wool, concrete and glass are
  # all perfectly good building material, and so are the blocks which cannot be crafted but still do
  # something where they are placed, like barriers, spawners or budding amethyst.
  blacklist-patterns:
    # Decorative sets, useless without a crafting table, a jukebox or a mount.
    - "*_banner_pattern"
    - "*_pottery_sherd"
    - "*_smithing_template"
    - "*_harness"
    - "*_dye"
    - "*_horse_armor"
    - "*_nautilus_armor"
    - "music_disc_*"
    - "disc_fragment_*"
    # Operator tools, which do nothing for a player in survival.
    - chain_command_block
    - command_block
    - command_block_minecart
    - debug_stick
    - frogspawn
    - jigsaw
    - knowledge_book
    - light
    - repeating_command_block
    - structure_block
    - structure_void

  # Items which stay in the pool even though a pattern above matches them.
  # Useful for keeping one member of a family that is otherwise dropped, as done here with the
  # happy ghast harnesses: one is a fine joke of an item to be handed, sixteen are a colour catalogue.
  blacklist-exceptions:
    - white_harness

  # How often items are given relative to each other, as the same patterns used above.
  # Everything not mentioned here has a weight of 1. A weight of 25 therefore means "25 times as
  # likely as an ordinary item", and a weight of 0 keeps an item out of the pool entirely, the same
  # as blacklisting it.
  # Where several patterns match one item, the longest pattern wins, so 'splash_potion: 1' keeps its
  # weight next to a '*potion: 25'. The order of the lines does not matter.
  # Potions are weighted up by default because there are only four potion items against hundreds of
  # blocks: at an even weight, a player saw one roughly every sixth game.
  # Remove the section entirely to go back to these defaults; leave it empty to weight nothing.
  weights:
    potion: 25
    splash_potion: 25
    lingering_potion: 25
    tipped_arrow: 25

  # Items which only make sense together, so that being given one of them makes the others likely.
  # A happy ghast spawn egg with no harness is a wasted item cycle, and so is a bow with no arrows.
  # Every group takes:
  #
  #   items:
  #     The items the group makes likely, as the same patterns used above. Required.
  #
  #   triggers:
  #     The items which set the group off. Left out, every item in the group triggers all the others,
  #     which is what a matching pair wants: whichever half turns up first asks for the other.
  #
  #   weight:
  #     The weight the group's items are drawn with while it is active, against the weight of 1 an
  #     ordinary item has. A group never makes an item rarer than it already is.
  #     Default: 250
  #
  #   mode:
  #     | -> once       : an item stops being likely once the player has been given it, so a pair
  #     |                 completes itself and is then done with.
  #     | -> repeating  : the items stay likely for the rest of the game, which is what ammunition
  #     |                 wants - a bow is worth something for as long as the arrows keep coming.
  #     Default: once
  #
  # Remove the section entirely to go back to these defaults; leave it empty to use no groups at all.
  groups:

    # A happy ghast cannot be ridden without a harness, and a harness is nothing without the ghast.
    happy-ghast:
      weight: 600
      items:
        - happy_ghast_spawn_egg
        - "*_harness"

    # Gliding off a pillar is only an escape with something to fly on with.
    elytra:
      weight: 400
      items:
        - elytra
        - firework_rocket

    # TNT nobody can light is a decoration, and a lighter with nothing to light is a torch.
    explosives:
      weight: 400
      items:
        - tnt
        - flint_and_steel

    # A minecart only goes somewhere once there is rail under it.
    minecart:
      weight: 300
      items:
        - minecart
        - rail

    # A saddle is only a saddle once there is something to put it on.
    saddle:
      weight: 300
      items:
        - saddle
        - pig_spawn_egg

    # Outside the nether a respawn anchor is a bomb, but only a charged one.
    respawn-anchor:
      weight: 300
      items:
        - respawn_anchor
        - glowstone

    # A bow keeps being worth something for as long as the arrows keep coming.
    archery:
      mode: repeating
      weight: 150
      triggers:
        - bow
        - crossbow
      items:
        - arrow
        - spectral_arrow
        - tipped_arrow

    # Rockets are ammunition too, but only for a crossbow.
    rockets:
      mode: repeating
      weight: 150
      triggers:
        - crossbow
      items:
        - firework_rocket


# Game Modes #
# The settings of every game mode, named as '/pillar-peril start' knows them.
# A mode missing from this section still works and simply uses the values shown as defaults below.
#
# Every mode takes the same keys:
#
#   cooldown: 5
#     The time in seconds between receiving items.
#
#   time-limit: 5min
#     How long a game can last at most. Please only use one time unit, like '90s', '5min' or '1h'.
#
#   visual:
#     color: "#FFFFFF"
#       The theme color of the mode as a hex code, used for the scoreboard and its messages.
#     show-scoreboard: true
#       Whether to show a scoreboard with the mode, the time left and everyone's kills.
#     show-actionbar: false
#       Whether to show the item countdown in the action bar.
#     show-bossbar: false
#       Whether to show the item countdown as a boss bar.
#
#   generator:
#     horizontal: circular
#       The layout the pillars are built in. Either "circular" or "random".
modes:

  # Chaos Mode - Randomized pillar layout, fast item cooldown.
  chaos:
    cooldown: 3
    time-limit: 8min
    visual:
      color: "#FF5555"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: random

  # Item Shuffle Mode - Items replaced every 10s (9 new items).
  item-shuffle:
    cooldown: 10
    time-limit: 5min
    visual:
      color: "#A3FF54"
      show-scoreboard: true
      show-actionbar: true
      show-bossbar: false
    generator:
      horizontal: circular

  # Original Mode - Original gameplay as seen in early videos.
  original:
    cooldown: 5
    time-limit: 5min
    visual:
      color: "#FFFFFF"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: circular


# Arenas #
# The places games can be started in, so that starting one only needs a name.
# '/pillar-peril start' picks a random arena unless you name one.
# The Y coordinate is ignored, as pillars are always built at `platform-height`.
arenas:

  # The arena's id, as used in '/pillar-peril start <mode> <arena>'.
  main:
    world: world
    location:
      x: 0.0
      y: 0.0
      z: 0.0

    # Optional. The time of day games in this arena are played at.
    # Either a tick of the day (0-24000) or one of the names '/time set' knows:
    # day (1000), noon (6000), sunset (12000), night (13000), midnight (18000), sunrise (23000).
    # Leave this out to play at whatever time the world is at.
    # Note that time keeps passing during the game unless the daylight cycle is turned off below.
    time: noon

    # Optional. Game rules to apply for as long as a game in this arena runs.
    # Every rule left out here simply keeps the value it has in the world, and everything set here
    # is put back the way it was once the game ends.
    # Both the current names and the ones from before 1.21.9 are understood.
    gamerules:
      doDaylightCycle: false # Keeps the sun where `time` above put it.
      doWeatherCycle: false
      mobGriefing: false


# Disposable Worlds #
# Runs every game in a temporary world of its own, which is deleted once the game is over.
# This is the most reliable way to clean up an arena: instead of undoing block and entity changes one by one,
# the entire world is thrown away, so nothing can ever be left behind — no matter what caused the change.
disposable-worlds:

  # Whether games run in a temporary world instead of the world they were started in.
  # With this disabled, arenas are rolled back block by block, which can miss changes
  # caused by things like flowing water, explosions, or falling blocks.
  # Default: true
  enabled: true

  # How the temporary world is created.
  #   Available Modes:
  #     | -> void  : a brand-new, completely empty world. Instant and takes practically no space.
  #     | -> copy  : a full copy of the world the game is started in, so any scenery you built - a floor
  #                  below the pillars, a skybox, a lobby - is there in every game and comes back untouched
  #                  afterwards. The world being copied acts as a template and is never played in itself.
  #                  Build a small world just for this: copying a normal survival world is far too slow,
  #                  which is what `max-copy-size` below guards against.
  mode: void

  # The name of the temporary world.
  #   Available Placeholders:
  #     | -> '{id}'  : started game's ID
  name: pp-{id}

  # Only for the 'copy' mode: refuse to copy worlds larger than this, in MiB.
  # Copying a large survival world per game would take minutes and fill up the disk, so games are
  # refused rather than started in the template world, which would damage it.
  # Set to 0 to allow any size.
  # Default: 128
  max-copy-size: 128


# Disable FastStats Integration #
# FastStats sends completely anonymous data about the server's Minecraft version, used game modes, etc.
# to improve the plugin based on real usage data.
# If you do not want to send this data, feel free to opt out here, in FastStats' own configuration,
# or using the `-Dfaststats.enabled=false` JVM flag to disable FastStats globally.
disable-faststats: false

# The Configuration Version #
# DO NOT MODIFY THIS, OR THE CONFIGURATION WILL LIKELY BREAK OR BE RESET!
version: 9
